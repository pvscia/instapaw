spring.application.name=instapaws

# DATABASE CONFIGURATION
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/instapaws
spring.datasource.username=instapaws_user
spring.datasource.password=password123
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# FLYWAY CONFIGURATION
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true

# SERVER
server.servlet.context-path=/instapaws/api/
server.port=8080

# JWT SETTINGS
jwt.secret=verylongjwtsecretkey12345678woiudhpanjangg
jwt.expiration-ms=86400000
#jwt.expiration-ms=10000
